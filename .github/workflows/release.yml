name: 发布 Overlap Helper 安装包

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 校验源码与构建安装包
        run: |
          python -m compileall -q overlap_motion tests install.py
          python -B -m unittest discover -s tests -p test_solver.py -v
          python -B -m unittest discover -s tests -p test_install.py -v
          python tools/build_release.py
          python -c 'import os; from tools.build_release import version; assert os.environ["GITHUB_REF_NAME"] == "v"+version'
      - name: 创建中文 Release 并上传 ZIP
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "Overlap Helper $GITHUB_REF_NAME：计算提速与稳定性优化" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
